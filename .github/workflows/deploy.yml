name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vocabulary-bot
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t vocabulary-bot:latest .

      - name: Save image archive
        run: docker save vocabulary-bot:latest | gzip > vocabulary-bot-image.tar.gz

      - name: Render production .env
        run: bash deploy/render-env.sh .env.deploy
        env:
          APP_ENV: ${{ vars.APP_ENV }}
          LOG_PATH: ${{ vars.LOG_PATH }}
          SYNC_ENABLED: ${{ vars.SYNC_ENABLED }}
          NOTIFICATIONS_ENABLED: ${{ vars.NOTIFICATIONS_ENABLED }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME }}
          TELEGRAM_ADMIN_ID: ${{ vars.TELEGRAM_ADMIN_ID }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ vars.TELEGRAM_ALLOWED_CHAT_IDS }}
          TELEGRAM_TARGET_CHANNEL_ID: ${{ vars.TELEGRAM_TARGET_CHANNEL_ID }}
          TELEGRAM_POLLING_ENABLED: ${{ vars.TELEGRAM_POLLING_ENABLED }}
          TELEGRAM_API_BASE_URL: ${{ vars.TELEGRAM_API_BASE_URL }}
          TELEGRAM_REVIEW_SPOILER_TRANSLATIONS: ${{ vars.TELEGRAM_REVIEW_SPOILER_TRANSLATIONS }}
          REVIEW_DOCUMENT_PUSH_FACTOR: ${{ vars.REVIEW_DOCUMENT_PUSH_FACTOR }}
          REVIEW_BOOK_PUSH_FACTOR: ${{ vars.REVIEW_BOOK_PUSH_FACTOR }}
          SCHEDULE_TIMEZONE: ${{ vars.SCHEDULE_TIMEZONE }}
          AUTO_SYNC_CRON: ${{ vars.AUTO_SYNC_CRON }}
          AUTO_PUSH_CRON: ${{ vars.AUTO_PUSH_CRON }}
          AUTO_LOGS_CRON: ${{ vars.AUTO_LOGS_CRON }}
          POCKETBOOK_SYNC_ENABLED: ${{ vars.POCKETBOOK_SYNC_ENABLED }}
          POCKETBOOK_EMAIL: ${{ vars.POCKETBOOK_EMAIL }}
          POCKETBOOK_REFRESH_TOKEN: ${{ vars.POCKETBOOK_REFRESH_TOKEN }}
          POCKETBOOK_SHOP_NAME: ${{ vars.POCKETBOOK_SHOP_NAME }}
          POCKETBOOK_API_BASE_URL: ${{ vars.POCKETBOOK_API_BASE_URL }}
          POCKETBOOK_TOKEN_PATH: ${{ vars.POCKETBOOK_TOKEN_PATH }}
          POCKETBOOK_BOOK_CONTEXT_ENABLED: ${{ vars.POCKETBOOK_BOOK_CONTEXT_ENABLED }}
          POCKETBOOK_BOOK_CACHE_DIR: ${{ vars.POCKETBOOK_BOOK_CACHE_DIR }}
          POCKETBOOK_BOOK_CACHE_MAX: ${{ vars.POCKETBOOK_BOOK_CACHE_MAX }}
          GOOGLE_SHEET_SYNC_ENABLED: ${{ vars.GOOGLE_SHEET_SYNC_ENABLED }}
          GOOGLE_SPREADSHEET_ID: ${{ vars.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SHEET_NAME: ${{ vars.GOOGLE_SHEET_NAME }}
          GOOGLE_SHEET_RANGE: ${{ vars.GOOGLE_SHEET_RANGE }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          POCKETBOOK_PASSWORD: ${{ secrets.POCKETBOOK_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Validate rendered env
        run: python3 deploy/envfile.py .env.deploy

      - name: Configure SSH
        env:
          DEPLOY_SSH: ${{ secrets.DEPLOY_SSH }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH}" ] || [ -z "${DEPLOY_HOST}" ]; then
            echo "DEPLOY_SSH secret and DEPLOY_HOST variable are required"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_SSH}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          host="${DEPLOY_HOST#*@}"
          ssh-keyscan -H "${host}" >> ~/.ssh/known_hosts

      - name: Resolve deploy directory
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          if [ -n "${DEPLOY_PATH:-}" ]; then
            target_dir="${DEPLOY_PATH}"
          else
            target_dir="$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${DEPLOY_HOST}" 'printf "%s/vocabulary-bot" "${HOME}"')"
          fi
          echo "DEPLOY_TARGET_DIR=${target_dir}" >> "${GITHUB_ENV}"
          echo "Deploy directory: ${target_dir}"

      - name: Upload compose file and env
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          target_dir="${DEPLOY_TARGET_DIR}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${DEPLOY_HOST}" bash -s <<EOF
          set -euo pipefail
          target_dir='${target_dir}'
          if ! mkdir -p "\${target_dir}" 2>/dev/null; then
            if command -v sudo >/dev/null 2>&1; then
              sudo mkdir -p "\${target_dir}"
              sudo chown "\$(id -un):\$(id -gn)" "\${target_dir}"
            else
              echo "mkdir failed for \${target_dir}; create it on the server or set DEPLOY_PATH to a writable directory" >&2
              exit 1
            fi
          fi
          EOF
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes docker-compose.yml "${DEPLOY_HOST}:${target_dir}/docker-compose.yml"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes .env.deploy "${DEPLOY_HOST}:${target_dir}/.env"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${DEPLOY_HOST}" "chmod 600 '${target_dir}/.env'"

      - name: Deploy image and restart service
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          target_dir="${DEPLOY_TARGET_DIR}"

          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes vocabulary-bot-image.tar.gz "${DEPLOY_HOST}:/tmp/vocabulary-bot-image.tar.gz"

          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${DEPLOY_HOST}" bash -s <<EOF
          set -euo pipefail
          if docker info >/dev/null 2>&1; then
            docker_cmd=(docker)
          elif command -v sudo >/dev/null 2>&1 && sudo docker info >/dev/null 2>&1; then
            docker_cmd=(sudo docker)
          else
            echo "docker is not available for the deploy user; add the user to the docker group or configure passwordless sudo for docker" >&2
            exit 1
          fi

          gunzip -c /tmp/vocabulary-bot-image.tar.gz | "\${docker_cmd[@]}" load
          rm -f /tmp/vocabulary-bot-image.tar.gz
          cd '${target_dir}'
          "\${docker_cmd[@]}" compose up -d --remove-orphans
          "\${docker_cmd[@]}" image prune -f
          EOF
