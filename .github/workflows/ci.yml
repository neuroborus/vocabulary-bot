name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Validate deploy env rendering
        run: bash deploy/render-env_test.sh

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build binary
        run: CGO_ENABLED=0 go build -o /tmp/vocabulary-bot ./cmd/vocabulary-bot
